      text: "OVERRULED. RIGHT IDEA. WRONG EXHIBIT."
  s1_breakdown:
    - speaker: # TODO: WITNESS NAME
      expression: sweating      # optional hint
      text: "# TODO: the crack when caught"

  s1b_press:
    - speaker: # TODO: WITNESS NAME
      text: "# TODO: press response"
  s1b_press_repeat:
    - speaker: # TODO: WITNESS NAME
      text: "# TODO: repeat line"
  s1b_breakdown:
    - speaker: # TODO: WITNESS NAME
      text: "# TODO: hearsay realization"

  s2_press:
    - speaker: # TODO: WITNESS NAME
      text: "# TODO: press response"
  s2_press_repeat:
    - speaker: # TODO: WITNESS NAME
      text: "# TODO: repeat line"

  # -- witness 2 --
  s3_hint:
    - speaker: # TODO: DINO SAURUS
      text: "# TODO: could she have seen it?"
  s3_press:
    - speaker: # TODO: WITNESS NAME
      text: "# TODO: press response"
  s3_press_repeat:
    - speaker: # TODO: WITNESS NAME
      text: "# TODO: repeat line"
  s3_breakdown:
    - speaker: # TODO: WITNESS NAME
      text: "# TODO: caught speculating"

  s4_press:
    - speaker: # TODO: WITNESS NAME
      text: "# TODO: press response"
  s4_press_repeat:
    - speaker: # TODO: WITNESS NAME
      text: "# TODO: repeat line"

  # -- witness 3 --
  s5_press:
    - speaker: # TODO: WITNESS NAME
      text: "# TODO: press response"
  s5_press_repeat:
    - speaker: # TODO: WITNESS NAME
      text: "# TODO: repeat line"
  s5_breakdown:
    - speaker: # TODO: WITNESS NAME
      expression: sweating
      text: "# TODO: the confession"

  s6_press:
    - speaker: # TODO: WITNESS NAME
      text: "# TODO: press response"
  s6_press_repeat:
    - speaker: # TODO: WITNESS NAME
      text: "# TODO: repeat line"

  # -- Phase B: interruption breakdowns --
  p2_breakdown:
    - speaker: # TODO: WITNESS NAME
      expression: sweating
      text: "# TODO: he's leading me!"
  p3_breakdown:
    - speaker: # TODO: WITNESS NAME
      expression: sweating
      text: "# TODO: sustained?! fine."

  # -- shared judge lines --
  rebuke:
    - speaker: JUDGE TRICERA
      text: "OVERRULED. WATCH YOURSELF, COUNSELOR."
  rebuke_b:
